<script>/* Fehler des Bureau mitschreiben, bevor irgendetwas anderes läuft: liest die Prüfung (pruefung.html) */
(function(){var zahl=0;function merk(t){t=String(t);if(++zahl>20||/Load failed|access control|abort|NetworkError/i.test(t))return;/* 15.10.2026: scheiterte die Meldung selbst (Safari beim Seitenwechsel: «Load failed»), meldete sie sich erneut, 5000 Mal in Sekunden; darum Netzfehler nie melden und höchstens 20 je Seite */
try{var a=JSON.parse(localStorage.getItem('bureau-fehler')||'[]');a.push({zeit:new Date().toISOString(),text:t.slice(0,600)});localStorage.setItem('bureau-fehler',JSON.stringify(a.slice(-30)))}catch(e){}
try{fetch('api/fehler',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t.slice(0,600)}),keepalive:true}).catch(function(){})}catch(e){}}
window.addEventListener('error',function(e){merk((e.message||'Fehler')+' · '+(e.filename||'').split('/').pop()+':'+(e.lineno||''))});
window.addEventListener('unhandledrejection',function(e){merk('Versprechen: '+((e.reason&&e.reason.message)||e.reason))});window.bureauMerk=merk})();</script>
